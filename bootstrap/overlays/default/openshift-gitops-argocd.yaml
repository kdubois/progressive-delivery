apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
spec:
  server:
    autoscale:
      enabled: false
    grpc:
      ingress:
        enabled: false
    ingress:
      enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 125m
        memory: 128Mi
    route:
      enabled: true
    service:
      type: ''
  grafana:
    enabled: false
    ingress:
      enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
    route:
      enabled: false
  monitoring:
    enabled: false
  notifications:
    enabled: false
  prometheus:
    enabled: false
    ingress:
      enabled: false
    route:
      enabled: false
  initialSSHKnownHosts: {}
  sso:
    dex:
      openShiftOAuth: true
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 250m
          memory: 128Mi
    provider: dex
  applicationSet:
    resources:
      limits:
        cpu: '2'
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 512Mi
    webhookServer:
      ingress:
        enabled: false
      route:
        enabled: false
  rbac:
    policy: |
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
    scopes: '[groups]'
  repo:
    resources:
      limits:
        cpu: '1'
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 256Mi
  resourceExclusions: |
    - apiGroups:
      - tekton.dev
      clusters:
      - '*'
      kinds:
      - TaskRun
      - PipelineRun
  # Health checks for the operator CRs the workload apps deploy (Strimzi Kafka, Infinispan).
  # Stock Argo CD cannot see a custom resource's readiness, so without these a sync wave
  # advances before Kafka is Ready. Same Lua body per kind: the named condition True is
  # Healthy, False is Degraded, anything else Progressing.
  resourceHealthChecks:
  - group: kafka.strimzi.io
    kind: Kafka
    check: |
      hs = {}
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, c in ipairs(obj.status.conditions) do
          if c.type == "Ready" then
            hs.status = c.status == "True" and "Healthy" or (c.status == "False" and "Degraded" or "Progressing")
            hs.message = c.message
            return hs
          end
        end
      end
      hs.status = "Progressing"
      return hs
  - group: kafka.strimzi.io
    kind: KafkaNodePool
    check: |
      hs = {}
      if obj.status ~= nil then
        if obj.status.conditions ~= nil then
          for _, c in ipairs(obj.status.conditions) do
            if c.type == "Ready" then
              hs.status = c.status == "True" and "Healthy" or (c.status == "False" and "Degraded" or "Progressing")
              hs.message = c.message
              return hs
            end
          end
        end
        -- This AMQ Streams version publishes no conditions on the pool: the operator
        -- assigns a node id per created broker, so a full set of ids is the readiness
        -- proxy. The Kafka CR reports the brokers' own readiness.
        if obj.status.nodeIds ~= nil and obj.spec ~= nil and obj.spec.replicas ~= nil then
          if #obj.status.nodeIds >= obj.spec.replicas then
            hs.status = "Healthy"
            return hs
          end
        end
      end
      hs.status = "Progressing"
      return hs
  - group: kafka.strimzi.io
    kind: KafkaTopic
    check: |
      hs = {}
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, c in ipairs(obj.status.conditions) do
          if c.type == "Ready" then
            hs.status = c.status == "True" and "Healthy" or (c.status == "False" and "Degraded" or "Progressing")
            hs.message = c.message
            return hs
          end
        end
      end
      hs.status = "Progressing"
      return hs
  - group: infinispan.org
    kind: Infinispan
    check: |
      hs = {}
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, c in ipairs(obj.status.conditions) do
          -- The operator writes the condition as WellFormed (capital W).
          if c.type == "WellFormed" then
            hs.status = c.status == "True" and "Healthy" or (c.status == "False" and "Degraded" or "Progressing")
            hs.message = c.message
            return hs
          end
        end
      end
      hs.status = "Progressing"
      return hs
  ha:
    enabled: false
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
  tls:
    ca: {}
  redis:
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 250m
        memory: 128Mi
  controller:
    processors: {}
    resources:
      limits:
        cpu: '2'
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 1Gi
    sharding: {}