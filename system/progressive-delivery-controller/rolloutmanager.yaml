apiVersion: argoproj.io/v1alpha1
kind: RolloutManager
metadata:
  name: argo-rollouts
  namespace: openshift-gitops
spec:
  plugins:
    metric:
      - name: argoproj-labs/metric-ai
        # Fork release that forwards the uncertainty pause gate to the agent.
        # Replace with the upstream argoproj-labs release once the plugin PR merges.
        location: https://github.com/argoproj-labs/rollouts-plugin-metric-ai/releases/download/v0.1.10/rollouts-plugin-metric-ai-linux-amd64
    trafficManagement: []
