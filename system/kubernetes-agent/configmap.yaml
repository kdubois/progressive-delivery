apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernetes-agent-config
  namespace: openshift-gitops
data:
  # Analysis model configuration (any OpenAI-compatible endpoint)
  #ANALYSIS_MODEL: Qwen3.6-35B-A3B
  ANALYSIS_MODEL: rits/zai-org/glm-5-3
  ANALYSIS_BASE_URL: https://api.enmaas.devshift.net/v1
  # Second-opinion tier for the analysis escalation (open weights, like the cheap tier).
  # Empty model disables the escalation; the key comes from the secret.
  ANALYSIS_SECOND_OPINION_MODEL: rits/deepseek-ai/DeepSeek-V4.1-Flash-1017
  ANALYSIS_SECOND_OPINION_BASE_URL: https://api.enmaas.devshift.net/v1
  #ANALYSIS_MODEL: gemini-3.5-flash
  #ANALYSIS_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/

  QUARKUS_PROFILE: "prod"
