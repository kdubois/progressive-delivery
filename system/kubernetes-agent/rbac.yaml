apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernetes-agent
  namespace: openshift-gitops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernetes-agent
rules:
  # Read pods, logs, and events
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "services", "configmaps", "endpoints"]
    verbs: ["get", "list", "watch"]
  # Read deployments and other workloads
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  # Read Argo Rollouts (rollout summary endpoint, canary analysis context)
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "analysisruns", "analysistemplates", "clusteranalysistemplates"]
    verbs: ["get", "list", "watch"]
  # Read metrics
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernetes-agent
subjects:
  - kind: ServiceAccount
    name: kubernetes-agent
    namespace: openshift-gitops
roleRef:
  kind: ClusterRole
  name: kubernetes-agent
  apiGroup: rbac.authorization.k8s.io
---
# Allows the kubernetes-agent to read its own credentials: the %prod profile
# loads the kubernetes-agent Secret through quarkus-kubernetes-config. Scoped
# to this namespace instead of granting secrets access cluster-wide.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubernetes-agent-secrets
  namespace: openshift-gitops
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-agent-secrets-binding
  namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubernetes-agent-secrets
subjects:
- kind: ServiceAccount
  name: kubernetes-agent
  namespace: openshift-gitops
