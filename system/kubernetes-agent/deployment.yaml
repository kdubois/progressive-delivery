apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-agent
  namespace: openshift-gitops
  labels:
    app: kubernetes-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubernetes-agent
  template:
    metadata:
      labels:
        app: kubernetes-agent
    spec:
      serviceAccountName: kubernetes-agent
      containers:
        - name: agent
          #image: quay.io/kevindubois/kubernetes-agent:latest
          image: ghcr.io/kdubois/kubernetes-agent:pr-87
          imagePullPolicy: Always # change to IfNotPresent when using a fixed version
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            # Load model configuration from ConfigMap
            - configMapRef:
                name: kubernetes-agent-config
          env:
            # Sensitive data from secrets
            - name: ANALYSIS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kubernetes-agent
                  key: analysis_api_key
                  optional: true
            # Optional: Jev (TypeSafe) key for the decision-model second opinion
            # on the analysis. Without it the grader disables itself and the
            # pause gate falls back to the analysis model's own confidence.
            - name: TYPESAFE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kubernetes-agent
                  key: typesafe_api_key
                  optional: true
            # Optional: strong-tier key for the analysis escalation. Without it
            # the escalation tier disables itself and a disputed conclusion
            # goes straight to the pause gate.
            - name: ANALYSIS_STRONG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kubernetes-agent
                  key: analysis_strong_api_key
                  optional: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /q/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /q/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      restartPolicy: Always
