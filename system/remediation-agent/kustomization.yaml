apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The remediation-agent service runs in openshift-gitops (next to the
# kubernetes-agent that calls it); the sandbox namespace manifests are here
# because they deploy together.
resources:
  - remediation-agent.yaml
  - sandbox-namespace.yaml
  - vault-secrets.yaml

# Credentials come from Vault KV (argo-rollouts/remediation-agent: github_token,
# llm_api_key) and are synced into both namespaces by the Vault Secrets Operator
# (vault-secrets.yaml). The bootstrap script writes the KV entry; if Vault
# restarted (dev mode, in-memory storage), re-run the Vault bootstrap or:
#   vault kv put secret/argo-rollouts/remediation-agent \
#     github_token=<fine-grained PAT> llm_api_key=<key>
