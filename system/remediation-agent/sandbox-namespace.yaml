# Sandbox namespace for remediation runs.
#
# The coding agent executes untrusted, LLM-generated commands here. Isolation:
# - pods run with restricted-v2, no service-account token, read-only root
#   filesystem (enforced by the Sandbox CR the remediation-agent creates)
# - the EgressFirewall below is the egress allow-list: GitHub (clone, push,
#   archives), Maven Central, the LLM endpoint, and the cluster DNS service.
#   Everything else — including the Kubernetes API and other cluster services —
#   is denied.
# - ingress is denied: nothing needs to reach the sandbox pods
#
# The GitHub token pushed into a sandbox is fine-grained to a single repository
# with contents:write and pull_requests:write: it can push, force-push and
# delete branches in that repository, open PRs, and nothing else. A human
# reviews every PR; auto-merge is deliberately deferred.
apiVersion: v1
kind: Namespace
metadata:
  name: remediation
---
# The EgressFirewall CRD requires the fixed name "default" and lowercase
# dnsName keys (the documented DNSName capitalization is pruned by the API).
apiVersion: k8s.ovn.org/v1
kind: EgressFirewall
metadata:
  name: default
  namespace: remediation
spec:
  egress:
  - type: Allow
    to:
      dnsName: github.com
  - type: Allow
    to:
      dnsName: api.github.com
  - type: Allow
    to:
      dnsName: objects.githubusercontent.com
  - type: Allow
    to:
      dnsName: codeload.github.com
  - type: Allow
    to:
      dnsName: repo.maven.apache.org
  - type: Allow
    to:
      dnsName: litemaas.rhoai.rh-aiservices-bu.com
  - type: Allow
    to:
      dnsName: api.enmaas.devshift.net
  - type: Allow
    to:
      dnsName: registry.npmjs.org
  # cluster DNS service, so DNSName rules resolve and the sandbox can use DNS
  - type: Allow
    to:
      cidrSelector: 172.30.0.10/32
    ports:
      - protocol: UDP
        port: 53
      - protocol: TCP
        port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: remediation
spec:
  podSelector: {}
  policyTypes:
    - Ingress
