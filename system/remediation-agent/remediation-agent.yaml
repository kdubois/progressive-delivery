# Remediation agent — A2A service that runs a swappable coding agent in an
# isolated sandbox, verifies fixes with the repository's test suite, and opens
# evidence-bearing PRs. Called by the kubernetes-agent over A2A after a
# rollback decision (http://remediation-agent:8080, same namespace).
#
# The sandbox pods run in the dedicated `remediation` namespace (sandbox-namespace.yaml)
# with an EgressFirewall allowing only GitHub, Maven Central, DNS and the LLM
# endpoint. The agent's own credentials live in the `remediation-agent` secret
# (github_token with contents:write + pull_requests:write on the target repo,
# and llm_api_key for the sandbox coding agent) — created manually, never in git.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-agent
  namespace: openshift-gitops
---
# Grants the service access to run sandboxes: create/delete the Sandbox CRs
# and read the sandbox pod logs. Scoped to the remediation namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: remediation-agent-sandboxes
  namespace: remediation
rules:
- apiGroups: ["agents.x-k8s.io"]
  resources: ["sandboxes"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remediation-agent-sandboxes
  namespace: remediation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: remediation-agent-sandboxes
subjects:
- kind: ServiceAccount
  name: remediation-agent
  namespace: openshift-gitops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: remediation-agent-config
  namespace: openshift-gitops
data:
  REMEDIATION_SANDBOX_IMAGE: ghcr.io/kdubois/remediation-sandbox:opencode
  REMEDIATION_SANDBOX_CODING_AGENT: opencode
  REMEDIATION_SANDBOX_MODEL: Qwen3.8-27B
  REMEDIATION_SANDBOX_LLM_BASE_URL: https://litemaas.rhoai.rh-aiservices-bu.com/v1
  REMEDIATION_SANDBOX_NAMESPACE: remediation
  REMEDIATION_SANDBOX_KEEP_FAILED: "true"
  REMEDIATION_ALLOWED_REPOS: https://github.com/kdubois/argo-rollouts-quarkus-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediation-agent
  namespace: openshift-gitops
  labels:
    app: remediation-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remediation-agent
  template:
    metadata:
      labels:
        app: remediation-agent
    spec:
      serviceAccountName: remediation-agent
      containers:
        - name: agent
          image: ghcr.io/kdubois/remediation-agent:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: remediation-agent-config
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: remediation-agent
                  key: github_token
                  optional: false
            - name: REMEDIATION_SANDBOX_LLM_SECRET_KEY
              value: llm_api_key
          readinessProbe:
            httpGet:
              path: /q/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: remediation-agent
  namespace: openshift-gitops
  labels:
    app: remediation-agent
spec:
  selector:
    app: remediation-agent
  ports:
    - name: http
      port: 8080
      targetPort: 8080
