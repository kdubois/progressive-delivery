# Vault Secrets Operator sync for the remediation-agent credentials.
# Vault KV: secret/argo-rollouts/remediation-agent (github_token, llm_api_key),
# written by the bootstrap script (bootstrap/bootstrap.java) or manually:
#   vault kv put secret/argo-rollouts/remediation-agent \
#     github_token=... llm_api_key=...
# The same KV entry feeds both namespaces: the service reads it for PR/issue
# creation, the sandbox pods mount it to push branches and reach the LLM.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: vault-connection
  namespace: remediation
spec:
  address: http://vault.openshift-gitops.svc.cluster.local:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: remediation-agent
  namespace: remediation
spec:
  vaultConnectionRef: vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: remediation-agent
    serviceAccount: default
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: remediation-agent
  namespace: remediation
spec:
  vaultAuthRef: remediation-agent
  type: kv-v2
  mount: secret
  path: argo-rollouts/remediation-agent
  hmacSecretData: true
  refreshAfter: 300s
  destination:
    create: true
    name: remediation-agent
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: remediation-agent
  namespace: openshift-gitops
spec:
  vaultConnectionRef: vault-connection
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: remediation-agent
    serviceAccount: remediation-agent
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: remediation-agent
  namespace: openshift-gitops
spec:
  vaultAuthRef: remediation-agent
  type: kv-v2
  mount: secret
  path: argo-rollouts/remediation-agent
  hmacSecretData: true
  refreshAfter: 300s
  destination:
    create: true
    name: remediation-agent
  rolloutRestartTargets:
  - kind: Deployment
    name: remediation-agent
