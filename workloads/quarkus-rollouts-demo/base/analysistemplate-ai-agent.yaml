apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: ai-analysis-agent
  namespace: quarkus-demo
spec:
  args:
  - name: namespace
  - name: canary-pod
  - name: stable-pod-label
    value: app=quarkus-demo,role=stable
  - name: canary-pod-label
    value: app=quarkus-demo,role=canary
  metrics:
    - name: ai-analysis
      failureLimit: 0
      # Recurring analysis: one measurement early in the rollout (log-visible bugs)
      # and one later when metrics have accumulated (weight-aware thresholds)
      count: 2
      interval: 30s
      initialDelay: 5s
      provider:
        plugin:
          argoproj-labs/metric-ai:
            # Required: Agent URL (must be explicitly configured)
            agentUrl: http://kubernetes-agent:8080
            # Required: Pod selectors for agent to fetch logs
            stableLabel: role=stable
            canaryLabel: role=canary
            # Optional: Create GitHub issues on failures
            githubUrl: https://github.com/kdubois/argo-rollouts-quarkus-demo
            baseBranch: main
            # Optional: Additional context for AI analysis
            extraPrompt: "Ignore color changes."
            # Optional: pause the rollout for human review when the analysis
            # promotes with confidence below the threshold. The measurement
            # stays successful; the pause holds the rollout until a human
            # runs `oc argo rollouts unpause` or aborts.
            #pauseOnUncertainty: true
            #uncertaintyThreshold: 50

