apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: quarkus-demo
  namespace: quarkus-demo
spec:
  replicas: 10
  revisionHistoryLimit: 1
  minReadySeconds: 2
  selector:
    matchLabels:
      app: quarkus-demo
  template:
    metadata:
      labels:
        app: quarkus-demo
    spec:
      serviceAccountName: quarkus-demo
      containers:
      - name: quarkus-demo
        #image: ghcr.io/kdubois/argo-rollouts-quarkus-demo:main
        #image: ghcr.io/kdubois/argo-rollouts-quarkus-demo:v2.nullpointer
        image: ghcr.io/kdubois/argo-rollouts-quarkus-demo:v2.nullpointer
        #image: ghcr.io/kdubois/argo-rollouts-quarkus-demo:v3.memoryleak
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: ROLLOUT_NAME
          value: "quarkus-demo"
        - name: ROLLOUT_NAMESPACE
          value: "quarkus-demo"
  strategy:
    canary:
      # Add revision labels to stable and canary pods
      stableMetadata:
        labels:
          role: stable
      canaryMetadata:
        labels:
          role: canary
      analysis:
        startingStep: 1 # first analysis fires during the initial pause, once the canary is Ready and serving traffic
        args:
        - name: service-name
          value: quarkus-demo-canary.quarkus-demo.svc.cluster.local
        - name: stable-pod-label
          value: app=quarkus-demo,role=stable
        - name: canary-pod-label
          value: app=quarkus-demo,role=canary
        - name: namespace
          value: quarkus-demo
        - name: canary-pod
          valueFrom:
            podTemplateHashValue: Latest
        templates:
          #- templateName: success-rate
          - templateName: ai-analysis-agent
      canaryService: quarkus-demo-canary
      stableService: quarkus-demo-stable
      trafficRouting:
        plugins:
          argoproj-labs/openshift:
            routes:
            - quarkus-demo
      steps:
      - setWeight: 10
      - pause: { duration: 10s } # canary serves 10% traffic; first AI analysis fires here (5s initial delay)
      - setWeight: 10
      - pause: { duration: 30s } # the first analysis completes during this window
      - setWeight: 60
      # The second analysis must complete before full promotion: a promoted rollout
      # terminates its background analysis run, and a measurement terminated mid-flight
      # counts as successful. One analysis takes up to ~45s (LLM plus the scoring retry
      # loop), so measurement 2 — starting ~30s after measurement 1 completes — can
      # finish as late as ~t+120s. 90s keeps the 100% step safely after that.
      - pause: { duration: 90s } # the second analysis completes here at 60% weight; also the window to manually abort if needed
      - setWeight: 100
      - pause: { duration: 5s } # finish rolling out to everyone
