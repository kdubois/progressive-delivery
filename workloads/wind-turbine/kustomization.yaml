apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The wind-turbine race game and its agent mesh. The manifests live with the code in the
# game's own repository (deploy/); this directory is only the pointer, and a new overlay
# needs no edit here.
#
# The remote base is pinned to a commit sha on purpose: Argo CD tracks this repo's
# revision, so a branch ref on the base would only be re-fetched on a hard refresh. Every
# change to the game's deploy tree lands as a bump of this sha, the same convention the
# rollouts apps use for image digests.
#
# Points at the test overlay (scratch namespace wind-turbine-gitops) while the migration
# runs step by step; step 9 of the game repo's plan switches it to
# deploy/overlays/openshift-cluster on main and takes over the live namespace. Until then
# the game repo's deploy script stays the source of the live cluster.
resources:
- https://github.com/redhat-developer-demos/quinoa-wind-turbine/deploy/overlays/test?ref=180e7c510450262b414dad0da8a571144c48705d
