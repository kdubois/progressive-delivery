apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: rollouts-demo
  namespace: canary
spec:
  replicas: 10
  revisionHistoryLimit: 1
  minReadySeconds: 5
  selector:
    matchLabels:
      app: rollouts-demo
  template:
    metadata:
      labels:
        app: rollouts-demo
    spec:
      containers:
      - name: rollouts-demo
        image: argoproj/rollouts-demo:blue
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
  strategy:
    canary:
      # Add revision labels to stable and canary pods
      stableMetadata:
        labels:
          role: stable
      canaryMetadata:
        labels:
          role: canary
      analysis:
        startingStep: 1 # first analysis fires during the initial pause, once the canary is Ready and serving traffic
        args:
        - name: service-name
          value: rollouts-demo-canary.canary.svc.cluster.local
        - name: stable-pod-label
          value: app=rollouts-demo,role=stable
        - name: canary-pod-label
          value: app=rollouts-demo,role=canary
        - name: namespace
          value: canary
        - name: canary-pod
          valueFrom:
            podTemplateHashValue: Latest
        templates:
          #- templateName: success-rate
          - templateName: ai-analysis-agent
      canaryService: rollouts-demo-canary
      stableService: rollouts-demo-stable
      trafficRouting:
        plugins:
          argoproj-labs/openshift:
            routes:
            - rollouts-demo
      steps:
      - setWeight: 10
      - pause: { duration: 20s } # canary serves 10% traffic; first AI analysis fires here (5s initial delay)
      - setWeight: 30
      # Both analyses must complete before full promotion: one analysis takes up to
      # ~45s (LLM plus the scoring retry loop) and the second starts ~30s after the
      # first completes, so it can finish as late as ~t+120s. 80s keeps the later
      # steps safely after that.
      - pause: { duration: 80s } # both analyses complete during this window (at 10% and 30% weight)
      - setWeight: 60
      - pause: { duration: 20s } # if everything is going well, continue rolling out
      - setWeight: 100
      - pause: { duration: 10s } # finish rolling out to everyone
