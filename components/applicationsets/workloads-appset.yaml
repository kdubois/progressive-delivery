apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workload-apps
  namespace: openshift-gitops
spec:
  generators:
  - git:
      repoURL: https://github.com/kdubois/progressive-delivery
      revision: deploy-test
      directories:
      - path: workloads/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      # The uncertainty gate patches spec.paused on the rollout at runtime;
      # selfHeal must not revert that pause back to the git state.
      ignoreDifferences:
      - group: argoproj.io
        kind: Rollout
        jsonPointers:
        - /spec/paused
      project: workloads
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - ApplyOutOfSyncOnly=true
        retry:
          limit: 15
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
      source:
        repoURL: https://github.com/kdubois/progressive-delivery
        targetRevision: deploy-test
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
